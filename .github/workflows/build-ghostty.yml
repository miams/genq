name: Build Ghostty

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  # Opt into Node.js 24 for actions (checkout, upload-artifact) before the
  # forced cutover on 2026-06-02. Node.js 20 removed 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ---------------------------------------------------------------------------
  #  
  # macOS — Ghostty fork → DMG
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (Ghostty)
    runs-on: macos-26

    steps:
      - name: Checkout genq
        uses: actions/checkout@v4

      - name: Checkout genq-terminal (private, via deploy key)
        uses: actions/checkout@v4
        with:
          repository: miams/genq-terminal
          ref: genq
          ssh-key: ${{ secrets.GENQ_TERMINAL_DEPLOY_KEY }}
          path: genq-terminal

      - name: Compute build version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "BUILD_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            SHORT_SHA="${{ github.sha }}"
            echo "BUILD_VERSION=${SHORT_SHA:0:8}" >> $GITHUB_ENV
          fi

      - name: Install Zig 0.15.2
        run: |
          # Install Zig directly (not via Nix) so it uses the system macOS 26
          # SDK rather than Nix's isolated macOS 15 SDK, which causes linker
          # failures (undefined symbols: _abort, _free, etc.)
          ZIG_VERSION="0.15.2"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$ZIG_URL" | tar -xJ -C /tmp
          sudo mv "/tmp/zig-aarch64-macos-${ZIG_VERSION}" /usr/local/zig
          sudo ln -sf /usr/local/zig/zig /usr/local/bin/zig
          zig version

      - name: Download Nushell (arm64 + x86_64)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nushell/nushell/releases/latest \
            -o /tmp/nu-release.json
          NU_VERSION=$(jq -r '.tag_name' /tmp/nu-release.json)
          echo "NU_VERSION=$NU_VERSION" >> $GITHUB_ENV
          echo "Bundling Nushell $NU_VERSION"
          ARM64_URL=$(jq -r '[.assets[] | select(.name | test("aarch64-apple-darwin\\.tar\\.gz$"))] | first | .browser_download_url' /tmp/nu-release.json)
          X64_URL=$(jq -r '[.assets[] | select(.name | test("x86_64-apple-darwin\\.tar\\.gz$"))] | first | .browser_download_url' /tmp/nu-release.json)
          mkdir -p /tmp/nu-arm64 /tmp/nu-x86_64
          curl -fsSL "$ARM64_URL" | tar -xzf - -C /tmp/nu-arm64
          curl -fsSL "$X64_URL"   | tar -xzf - -C /tmp/nu-x86_64
          echo "NU_ARM64=$(find /tmp/nu-arm64 -maxdepth 2 -name nu -type f | head -1)" >> $GITHUB_ENV
          echo "NU_X64=$(find /tmp/nu-x86_64 -maxdepth 2 -name nu -type f | head -1)"   >> $GITHUB_ENV

      - name: Build (arm64)
        working-directory: genq-terminal
        run: |
          zig build -Doptimize=ReleaseFast
          ditto zig-out/Ghostty.app /tmp/Ghostty-arm64.app

      - name: Build (x86_64)
        working-directory: genq-terminal
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-macos

      - name: Fix Info.plist (branding + Sparkle)
        working-directory: genq-terminal
        run: |
          fix_plist() {
            local plist="$1"
            local feed_url="$2"
            # Force CFBundleName regardless of Xcode PRODUCT_NAME override
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string GenQuery" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Set :CFBundleName GenQuery" "$plist"
            # Sparkle feed URL (arch-specific)
            /usr/libexec/PlistBuddy -c "Add :SUFeedURL string $feed_url" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Set :SUFeedURL $feed_url" "$plist"
          }
          fix_plist "/tmp/Ghostty-arm64.app/Contents/Info.plist" \
            "https://github.com/miams/genq/releases/latest/download/appcast-arm64.xml"
          fix_plist "zig-out/Ghostty.app/Contents/Info.plist" \
            "https://github.com/miams/genq/releases/latest/download/appcast-x86_64.xml"

      - name: Bundle genq into app bundles
        run: |
          bundle_genq() {
            local app_path="$1"
            local nu_bin="$2"
            local genq_res="$app_path/Contents/Resources/genq"
            mkdir -p "$genq_res/src/lib" "$genq_res/data" "$genq_res/scripts"
            cp "$nu_bin" "$genq_res/nu"
            chmod +x "$genq_res/nu"
            cp "$GITHUB_WORKSPACE/src/main.nu"                "$genq_res/src/"
            cp -R "$GITHUB_WORKSPACE/src/lib/common"          "$genq_res/src/lib/"
            cp -R "$GITHUB_WORKSPACE/src/lib/ext"             "$genq_res/src/lib/"
            cp "$GITHUB_WORKSPACE/data/pres2025.rmtree"       "$genq_res/data/"
            cp "$GITHUB_WORKSPACE/scripts/genquery-start"     "$genq_res/scripts/"
            echo "$BUILD_VERSION" > "$genq_res/VERSION"
            chmod +x "$genq_res/scripts/genquery-start"
          }
          bundle_genq /tmp/Ghostty-arm64.app                                   "$NU_ARM64"
          bundle_genq "$GITHUB_WORKSPACE/genq-terminal/zig-out/Ghostty.app"    "$NU_X64"

      - name: Sign
        working-directory: genq-terminal
        run: |
          xattr -cr /tmp/Ghostty-arm64.app
          codesign --force --deep --sign - /tmp/Ghostty-arm64.app
          xattr -cr zig-out/Ghostty.app
          codesign --force --deep --sign - "zig-out/Ghostty.app"

      - name: Package DMGs
        working-directory: genq-terminal
        run: |
          # arm64 DMG
          mkdir -p /tmp/genq-dmg-arm64
          ditto /tmp/Ghostty-arm64.app "/tmp/genq-dmg-arm64/GenQuery Terminal.app"
          ln -s /Applications /tmp/genq-dmg-arm64/Applications
          hdiutil create \
            -volname "GenQuery Terminal" \
            -srcfolder /tmp/genq-dmg-arm64 \
            -ov -format UDZO \
            -o "$GITHUB_WORKSPACE/GenQuery-Terminal-macOS-arm64.dmg"

          # x86_64 DMG
          mkdir -p /tmp/genq-dmg-x86_64
          ditto "zig-out/Ghostty.app" "/tmp/genq-dmg-x86_64/GenQuery Terminal.app"
          ln -s /Applications /tmp/genq-dmg-x86_64/Applications
          hdiutil create \
            -volname "GenQuery Terminal" \
            -srcfolder /tmp/genq-dmg-x86_64 \
            -ov -format UDZO \
            -o "$GITHUB_WORKSPACE/GenQuery-Terminal-macOS-x86_64.dmg"

      # Sign DMGs here (macOS runner) so sign_update binary can execute.
      # Skipped silently if SPARKLE_PRIVATE_KEY secret is not configured.
      - name: Sign DMGs with Sparkle
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_VERSION="2.9.1"
          curl -fsSL \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o sparkle.tar.xz
          mkdir -p sparkle_tools
          tar -xf sparkle.tar.xz -C sparkle_tools
          printf '%s' "$SPARKLE_PRIVATE_KEY" > signing.key
          ./sparkle_tools/bin/sign_update -f signing.key \
            GenQuery-Terminal-macOS-arm64.dmg > sign_update_arm64.txt
          ./sparkle_tools/bin/sign_update -f signing.key \
            GenQuery-Terminal-macOS-x86_64.dmg > sign_update_x86_64.txt
          rm -f signing.key
          echo "Sparkle signatures written."

      - name: Upload to S3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          GENQ_RELEASES_BUCKET:  ${{ vars.GENQ_RELEASES_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$GENQ_RELEASES_BUCKET" ]; then
            echo "S3 upload skipped (GENQ_RELEASES_BUCKET or AWS credentials not configured)"
            exit 0
          fi
          for ARCH in arm64 x86_64; do
            aws s3 cp "GenQuery-Terminal-macOS-${ARCH}.dmg" \
              "s3://$GENQ_RELEASES_BUCKET/macos/${ARCH}/latest/GenQuery-Terminal-macOS-${ARCH}.dmg"
            aws s3 cp "GenQuery-Terminal-macOS-${ARCH}.dmg" \
              "s3://$GENQ_RELEASES_BUCKET/macos/${ARCH}/$BUILD_VERSION/GenQuery-Terminal-macOS-${ARCH}.dmg"
          done
          echo "Uploaded arm64 and x86_64 to s3://$GENQ_RELEASES_BUCKET/macos/ (version: $BUILD_VERSION)"

      - name: Upload arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-macOS-arm64
          path: GenQuery-Terminal-macOS-arm64.dmg
          retention-days: 14

      - name: Upload x86_64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-macOS-x86_64
          path: GenQuery-Terminal-macOS-x86_64.dmg
          retention-days: 14

      - name: Upload Sparkle signatures
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-signatures
          path: |
            sign_update_arm64.txt
            sign_update_x86_64.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux — Ghostty fork → AppImage (stub, packaging TBD)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux (Ghostty)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout genq
        uses: actions/checkout@v4

      - name: Checkout genq-terminal (private, via deploy key)
        uses: actions/checkout@v4
        with:
          repository: miams/genq-terminal
          ref: genq
          ssh-key: ${{ secrets.GENQ_TERMINAL_DEPLOY_KEY }}
          path: genq-terminal

      - name: Compute build version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "BUILD_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            SHORT_SHA="${{ github.sha }}"
            echo "BUILD_VERSION=${SHORT_SHA:0:8}" >> $GITHUB_ENV
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build
        working-directory: genq-terminal
        run: nix develop -c zig build -Doptimize=ReleaseFast -Dapp-runtime=gtk

      - name: Package (stub — AppImage packaging TBD in Phase 3)
        working-directory: genq-terminal
        run: |
          tar -czf "$GITHUB_WORKSPACE/GenQuery-Terminal-Linux.tar.gz" \
            -C zig-out/bin ghostty

      - name: Upload to S3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          GENQ_RELEASES_BUCKET:  ${{ vars.GENQ_RELEASES_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$GENQ_RELEASES_BUCKET" ]; then
            echo "S3 upload skipped (GENQ_RELEASES_BUCKET or AWS credentials not configured)"
            exit 0
          fi
          aws s3 cp GenQuery-Terminal-Linux.tar.gz \
            "s3://$GENQ_RELEASES_BUCKET/linux/latest/GenQuery-Terminal-Linux.tar.gz"
          aws s3 cp GenQuery-Terminal-Linux.tar.gz \
            "s3://$GENQ_RELEASES_BUCKET/linux/$BUILD_VERSION/GenQuery-Terminal-Linux.tar.gz"
          echo "Uploaded to s3://$GENQ_RELEASES_BUCKET/linux/latest/ and /linux/$BUILD_VERSION/"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-Linux
          path: GenQuery-Terminal-Linux.tar.gz
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows x64 — Windows Terminal fork + bundled genq + Nushell → x64 .msix
  # ---------------------------------------------------------------------------
  build-windows-x64:
    name: Build Windows x64 (Windows Terminal)
    runs-on: windows-2022

    steps:
      - name: Checkout genq
        uses: actions/checkout@v4

      - name: Checkout genq-terminal-windows
        uses: actions/checkout@v4
        with:
          repository: miams/genq-terminal-windows
          ref: genq
          path: genq-terminal-windows

      - name: Compute build version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "BUILD_VERSION=${{ github.ref_name }}" >> $env:GITHUB_ENV
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 8)
            "BUILD_VERSION=$shortSha" >> $env:GITHUB_ENV
          }

      - name: Download Nushell x64
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/nushell/nushell/releases/latest" `
            -Headers @{Authorization = "Bearer $env:GITHUB_TOKEN"}
          $version = $release.tag_name
          Write-Host "Bundling Nushell $version"
          echo "NU_VERSION=$version" >> $env:GITHUB_ENV
          $x64url = ($release.assets | Where-Object { $_.name -match "x86_64-pc-windows-msvc\.zip$" }).browser_download_url
          Invoke-WebRequest $x64url -OutFile nu-x64.zip
          Expand-Archive nu-x64.zip -DestinationPath nu-x64

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore SDK-style projects
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          dotnet restore src\cascadia\WpfTerminalControl\WpfTerminalControl.csproj
          dotnet restore src\cascadia\WpfTerminalTestNetCore\WpfTerminalTestNetCore.csproj
          dotnet restore src\tools\TerminalStress\TerminalStress.csproj

      - name: Create signing certificate
        shell: pwsh
        run: |
          if ($env:GENQ_SIGNING_PFX_B64) {
            [System.IO.File]::WriteAllBytes(
              "genq-signing.pfx",
              [Convert]::FromBase64String($env:GENQ_SIGNING_PFX_B64)
            )
            echo "CERT_SOURCE=supplied" >> $env:GITHUB_ENV
          } else {
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=Zephyr Systems" `
              -KeyUsage DigitalSignature `
              -FriendlyName "GenQuery Terminal (Development - not for distribution)" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            $secPwd = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
            Export-PfxCertificate `
              -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
              -FilePath "genq-signing.pfx" `
              -Password $secPwd
            echo "CERT_SOURCE=self-signed" >> $env:GITHUB_ENV
          }
        env:
          GENQ_SIGNING_PFX_B64: ${{ secrets.GENQ_SIGNING_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.GENQ_SIGNING_PFX_PASSWORD || 'genq-dev-temp-unsigned' }}

      - name: Stage genq source files
        shell: pwsh
        run: |
          $pkgDir = "genq-terminal-windows\src\cascadia\CascadiaPackage\genq"
          New-Item -ItemType Directory -Force -Path "$pkgDir\src\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkgDir\config"  | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkgDir\scripts" | Out-Null
          Copy-Item -Force          "src\main.nu"       "$pkgDir\src\"
          Copy-Item -Recurse -Force "src\lib\common"    "$pkgDir\src\lib\"
          Copy-Item -Recurse -Force "src\lib\ext"       "$pkgDir\src\lib\"
          $scriptsDir = "genq-terminal-windows\genq\scripts"
          if (Test-Path $scriptsDir) {
            Copy-Item -Recurse -Force "$scriptsDir\*" "$pkgDir\scripts\"
          }
          $cfg = @(
            '[database]', 'active = ""', '',
            '[paths]', 'sql_dir = "sql"', 'lib_dir = "src/lib"',
            'ext_dir = "src/lib/ext"', 'output_dir = "vault"', '',
            '[display]', 'date_format = 1', 'table_mode = "rounded"', '',
            '[extensions]', 'enabled = ["miams", "pres2025"]'
          )
          $cfg | Set-Content -Encoding UTF8 "$pkgDir\config\default.toml"

      - name: Add nuget.org to NuGet sources
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          $configPath = "NuGet.Config"
          $xml = [xml](Get-Content $configPath)
          $src = $xml.configuration.packageSources
          $add = $xml.CreateElement("add")
          $add.SetAttribute("key", "nuget.org")
          $add.SetAttribute("value", "https://api.nuget.org/v3/index.json")
          $src.AppendChild($add) | Out-Null
          $xml.Save((Resolve-Path $configPath))

      - name: Build x64 Release
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          $nuExe = Get-ChildItem "..\nu-x64" -Recurse -Filter "nu.exe" | Select-Object -First 1
          Copy-Item -Force $nuExe.FullName "src\cascadia\CascadiaPackage\genq\nu.exe"
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          Invoke-OpenConsoleBuild `
            /p:Platform=x64 `
            /p:Configuration=Release `
            /p:WindowsTargetPlatformVersion=10.0.22621.0 `
            /p:TargetPlatformVersion=10.0.22621.0 `
            /p:WindowsTerminalBranding=Release

      - name: Sign x64 MSIX
        shell: pwsh
        run: |
          $sdkBin   = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64"
          $signtool = "$sdkBin\signtool.exe"
          $certPwd  = $env:CERT_PASSWORD
          $msix = Get-ChildItem -Path "genq-terminal-windows\src\cascadia\CascadiaPackage\AppPackages" -Recurse -Filter "*.msix" |
            Where-Object { $_.Name -match "x64" } | Select-Object -First 1
          if (-not $msix) { throw "x64 MSIX not found" }
          & $signtool sign /fd SHA256 /f genq-signing.pfx /p $certPwd $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Copy-Item $msix.FullName "$env:GITHUB_WORKSPACE\GenQuery-Terminal-Windows-x64.msix"
        env:
          CERT_PASSWORD: ${{ secrets.GENQ_SIGNING_PFX_PASSWORD || 'genq-dev-temp-unsigned' }}

      - name: Upload to S3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          GENQ_RELEASES_BUCKET:  ${{ vars.GENQ_RELEASES_BUCKET }}
        run: |
          if (-not $env:AWS_ACCESS_KEY_ID -or -not $env:GENQ_RELEASES_BUCKET) {
            Write-Host "S3 upload skipped"; exit 0
          }
          $msix = "$env:GITHUB_WORKSPACE\GenQuery-Terminal-Windows-x64.msix"
          aws s3 cp $msix "s3://$env:GENQ_RELEASES_BUCKET/windows/x64/latest/GenQuery-Terminal-Windows-x64.msix"
          aws s3 cp $msix "s3://$env:GENQ_RELEASES_BUCKET/windows/x64/$env:BUILD_VERSION/GenQuery-Terminal-Windows-x64.msix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-Windows-x64
          path: GenQuery-Terminal-Windows-x64.msix
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows ARM64 — Windows Terminal fork + bundled genq + Nushell → ARM64 .msix
  # ---------------------------------------------------------------------------
  build-windows-arm64:
    name: Build Windows ARM64 (Windows Terminal)
    runs-on: windows-2022

    steps:
      - name: Checkout genq
        uses: actions/checkout@v4

      - name: Checkout genq-terminal-windows
        uses: actions/checkout@v4
        with:
          repository: miams/genq-terminal-windows
          ref: genq
          path: genq-terminal-windows

      - name: Compute build version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "BUILD_VERSION=${{ github.ref_name }}" >> $env:GITHUB_ENV
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 8)
            "BUILD_VERSION=$shortSha" >> $env:GITHUB_ENV
          }

      - name: Download Nushell ARM64
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/nushell/nushell/releases/latest" `
            -Headers @{Authorization = "Bearer $env:GITHUB_TOKEN"}
          $version = $release.tag_name
          Write-Host "Bundling Nushell $version"
          echo "NU_VERSION=$version" >> $env:GITHUB_ENV
          $armUrl = ($release.assets | Where-Object { $_.name -match "aarch64-pc-windows-msvc\.zip$" }).browser_download_url
          Invoke-WebRequest $armUrl -OutFile nu-arm64.zip
          Expand-Archive nu-arm64.zip -DestinationPath nu-arm64

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore SDK-style projects
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          dotnet restore src\cascadia\WpfTerminalControl\WpfTerminalControl.csproj
          dotnet restore src\cascadia\WpfTerminalTestNetCore\WpfTerminalTestNetCore.csproj
          dotnet restore src\tools\TerminalStress\TerminalStress.csproj

      - name: Create signing certificate
        shell: pwsh
        run: |
          if ($env:GENQ_SIGNING_PFX_B64) {
            [System.IO.File]::WriteAllBytes(
              "genq-signing.pfx",
              [Convert]::FromBase64String($env:GENQ_SIGNING_PFX_B64)
            )
            echo "CERT_SOURCE=supplied" >> $env:GITHUB_ENV
          } else {
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=Zephyr Systems" `
              -KeyUsage DigitalSignature `
              -FriendlyName "GenQuery Terminal (Development - not for distribution)" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            $secPwd = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
            Export-PfxCertificate `
              -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
              -FilePath "genq-signing.pfx" `
              -Password $secPwd
            echo "CERT_SOURCE=self-signed" >> $env:GITHUB_ENV
          }
        env:
          GENQ_SIGNING_PFX_B64: ${{ secrets.GENQ_SIGNING_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.GENQ_SIGNING_PFX_PASSWORD || 'genq-dev-temp-unsigned' }}

      - name: Stage genq source files
        shell: pwsh
        run: |
          $pkgDir = "genq-terminal-windows\src\cascadia\CascadiaPackage\genq"
          New-Item -ItemType Directory -Force -Path "$pkgDir\src\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkgDir\config"  | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkgDir\scripts" | Out-Null
          Copy-Item -Force          "src\main.nu"       "$pkgDir\src\"
          Copy-Item -Recurse -Force "src\lib\common"    "$pkgDir\src\lib\"
          Copy-Item -Recurse -Force "src\lib\ext"       "$pkgDir\src\lib\"
          $scriptsDir = "genq-terminal-windows\genq\scripts"
          if (Test-Path $scriptsDir) {
            Copy-Item -Recurse -Force "$scriptsDir\*" "$pkgDir\scripts\"
          }
          $cfg = @(
            '[database]', 'active = ""', '',
            '[paths]', 'sql_dir = "sql"', 'lib_dir = "src/lib"',
            'ext_dir = "src/lib/ext"', 'output_dir = "vault"', '',
            '[display]', 'date_format = 1', 'table_mode = "rounded"', '',
            '[extensions]', 'enabled = ["miams", "pres2025"]'
          )
          $cfg | Set-Content -Encoding UTF8 "$pkgDir\config\default.toml"

      - name: Add nuget.org to NuGet sources
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          $configPath = "NuGet.Config"
          $xml = [xml](Get-Content $configPath)
          $src = $xml.configuration.packageSources
          $add = $xml.CreateElement("add")
          $add.SetAttribute("key", "nuget.org")
          $add.SetAttribute("value", "https://api.nuget.org/v3/index.json")
          $src.AppendChild($add) | Out-Null
          $xml.Save((Resolve-Path $configPath))

      - name: Build ARM64 Release
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          $nuExe = Get-ChildItem "..\nu-arm64" -Recurse -Filter "nu.exe" | Select-Object -First 1
          Copy-Item -Force $nuExe.FullName "src\cascadia\CascadiaPackage\genq\nu.exe"
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          & ".\dep\nuget\nuget.exe" restore OpenConsole.slnx
          & ".\dep\nuget\nuget.exe" restore dep\nuget\packages.config
          msbuild OpenConsole.slnx `
            /t:Restore `
            /p:Platform=ARM64 `
            /p:Configuration=Release `
            /p:WindowsTargetPlatformVersion=10.0.22621.0 `
            /p:TargetPlatformVersion=10.0.22621.0 `
            "/p:RestoreAdditionalProjectSources=https://api.nuget.org/v3/index.json"
          msbuild OpenConsole.slnx `
            /m `
            /p:Platform=ARM64 `
            /p:Configuration=Release `
            /p:WindowsTargetPlatformVersion=10.0.22621.0 `
            /p:TargetPlatformVersion=10.0.22621.0 `
            /p:WindowsTerminalBranding=Release

      - name: Sign ARM64 MSIX
        shell: pwsh
        run: |
          $sdkBin   = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64"
          $signtool = "$sdkBin\signtool.exe"
          $certPwd  = $env:CERT_PASSWORD
          $msix = Get-ChildItem -Path "genq-terminal-windows\src\cascadia\CascadiaPackage\AppPackages" -Recurse -Filter "*.msix" |
            Where-Object { $_.Name -match "ARM64" } | Select-Object -First 1
          if (-not $msix) { throw "ARM64 MSIX not found" }
          & $signtool sign /fd SHA256 /f genq-signing.pfx /p $certPwd $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Copy-Item $msix.FullName "$env:GITHUB_WORKSPACE\GenQuery-Terminal-Windows-ARM64.msix"
        env:
          CERT_PASSWORD: ${{ secrets.GENQ_SIGNING_PFX_PASSWORD || 'genq-dev-temp-unsigned' }}

      - name: Upload to S3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          GENQ_RELEASES_BUCKET:  ${{ vars.GENQ_RELEASES_BUCKET }}
        run: |
          if (-not $env:AWS_ACCESS_KEY_ID -or -not $env:GENQ_RELEASES_BUCKET) {
            Write-Host "S3 upload skipped"; exit 0
          }
          $msix = "$env:GITHUB_WORKSPACE\GenQuery-Terminal-Windows-ARM64.msix"
          aws s3 cp $msix "s3://$env:GENQ_RELEASES_BUCKET/windows/arm64/latest/GenQuery-Terminal-Windows-ARM64.msix"
          aws s3 cp $msix "s3://$env:GENQ_RELEASES_BUCKET/windows/arm64/$env:BUILD_VERSION/GenQuery-Terminal-Windows-ARM64.msix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-Windows-ARM64
          path: GenQuery-Terminal-Windows-ARM64.msix
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publish GitHub Release — only on v* tags, waits for all four builds
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows-x64, build-windows-arm64]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout genq
        uses: actions/checkout@v4

      - name: Download macOS arm64 DMG
        uses: actions/download-artifact@v4
        with:
          name: GenQuery-Terminal-macOS-arm64

      - name: Download macOS x86_64 DMG
        uses: actions/download-artifact@v4
        with:
          name: GenQuery-Terminal-macOS-x86_64

      - name: Download Linux tar.gz
        uses: actions/download-artifact@v4
        with:
          name: GenQuery-Terminal-Linux

      - name: Download Windows x64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: GenQuery-Terminal-Windows-x64

      - name: Download Windows ARM64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: GenQuery-Terminal-Windows-ARM64

      # -----------------------------------------------------------------------
      # Download Sparkle signatures produced by build-macos (macOS runner).
      # Generate arch-specific appcasts. Skipped if signatures not present.
      # -----------------------------------------------------------------------
      - name: Download Sparkle signatures
        id: dl-sigs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sparkle-signatures

      - name: Generate appcasts
        if: steps.dl-sigs.outcome == 'success'
        env:
          GENQ_VERSION: ${{ github.ref_name }}
          GENQ_BUILD: ${{ github.run_number }}
          GENQ_COMMIT: ${{ github.sha }}
        run: |
          GENQ_COMMIT_LONG="${GENQ_COMMIT}"
          GENQ_COMMIT="${GENQ_COMMIT:0:8}"
          for ARCH in arm64 x86_64; do
            GENQ_VERSION="$GENQ_VERSION" \
            GENQ_BUILD="$GENQ_BUILD" \
            GENQ_COMMIT="$GENQ_COMMIT" \
            GENQ_COMMIT_LONG="$GENQ_COMMIT_LONG" \
              python3 .github/scripts/update_appcast_tag.py "$ARCH"
            mv "appcast_${ARCH}_new.xml" "appcast-${ARCH}.xml"
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Build the asset list; add appcasts only when Sparkle signing ran.
          ASSETS=(
            GenQuery-Terminal-macOS-arm64.dmg
            GenQuery-Terminal-macOS-x86_64.dmg
            GenQuery-Terminal-Linux.tar.gz
            GenQuery-Terminal-Windows-x64.msix
            GenQuery-Terminal-Windows-ARM64.msix
          )
          if [ -f appcast-arm64.xml ] && [ -f appcast-x86_64.xml ]; then
            ASSETS+=(appcast-arm64.xml appcast-x86_64.xml)
          fi

          if gh release view "$TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" "${ASSETS[@]}" \
              --repo ${{ github.repository }} \
              --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo ${{ github.repository }} \
              --title "GenQuery $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
