name: Build Ghostty

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Opt into Node.js 24 for actions (checkout, upload-artifact) before the
  # forced cutover on 2026-06-02. Node.js 20 removed 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ---------------------------------------------------------------------------
  #  
  # macOS — Ghostty fork → DMG
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (Ghostty)
    runs-on: macos-26

    steps:
      - name: Checkout genq
        uses: actions/checkout@v4

      - name: Checkout genq-terminal (private, via deploy key)
        uses: actions/checkout@v4
        with:
          repository: miams/genq-terminal
          ref: genq
          ssh-key: ${{ secrets.GENQ_TERMINAL_DEPLOY_KEY }}
          path: genq-terminal

      - name: Install Zig 0.15.2
        run: |
          # Install Zig directly (not via Nix) so it uses the system macOS 26
          # SDK rather than Nix's isolated macOS 15 SDK, which causes linker
          # failures (undefined symbols: _abort, _free, etc.)
          ZIG_VERSION="0.15.2"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$ZIG_URL" | tar -xJ -C /tmp
          sudo mv "/tmp/zig-aarch64-macos-${ZIG_VERSION}" /usr/local/zig
          sudo ln -sf /usr/local/zig/zig /usr/local/bin/zig
          zig version

      - name: Build
        working-directory: genq-terminal
        run: zig build -Doptimize=ReleaseFast

      - name: Sign
        working-directory: genq-terminal
        run: |
          xattr -cr zig-out/Ghostty.app
          codesign --force --deep --sign - "zig-out/Ghostty.app"

      - name: Package DMG
        working-directory: genq-terminal
        run: |
          mkdir -p /tmp/genq-dmg
          cp -r "zig-out/Ghostty.app" "/tmp/genq-dmg/GenQuery Terminal.app"
          ln -s /Applications /tmp/genq-dmg/Applications
          hdiutil create \
            -volname "GenQuery Terminal" \
            -srcfolder /tmp/genq-dmg \
            -ov -format UDZO \
            -o "$GITHUB_WORKSPACE/GenQuery-Terminal-macOS.dmg"

      - name: Upload to S3
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          GENQ_RELEASES_BUCKET:  ${{ vars.GENQ_RELEASES_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$GENQ_RELEASES_BUCKET" ]; then
            echo "S3 upload skipped (GENQ_RELEASES_BUCKET or AWS credentials not configured)"
            exit 0
          fi
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:8}"
          aws s3 cp GenQuery-Terminal-macOS.dmg \
            "s3://$GENQ_RELEASES_BUCKET/macos/latest/GenQuery-Terminal-macOS.dmg"
          aws s3 cp GenQuery-Terminal-macOS.dmg \
            "s3://$GENQ_RELEASES_BUCKET/macos/$SHORT_SHA/GenQuery-Terminal-macOS.dmg"
          echo "Uploaded to s3://$GENQ_RELEASES_BUCKET/macos/latest/ and /macos/$SHORT_SHA/"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-macOS
          path: GenQuery-Terminal-macOS.dmg
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux — Ghostty fork → AppImage (stub, packaging TBD)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux (Ghostty)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout genq
        uses: actions/checkout@v4

      - name: Checkout genq-terminal (private, via deploy key)
        uses: actions/checkout@v4
        with:
          repository: miams/genq-terminal
          ref: genq
          ssh-key: ${{ secrets.GENQ_TERMINAL_DEPLOY_KEY }}
          path: genq-terminal

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        working-directory: genq-terminal
        run: nix develop -c zig build -Doptimize=ReleaseFast -Dapp-runtime=gtk

      - name: Package (stub — AppImage packaging TBD in Phase 3)
        working-directory: genq-terminal
        run: |
          tar -czf "$GITHUB_WORKSPACE/GenQuery-Terminal-Linux.tar.gz" \
            -C zig-out/bin ghostty

      - name: Upload to S3
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          GENQ_RELEASES_BUCKET:  ${{ vars.GENQ_RELEASES_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$GENQ_RELEASES_BUCKET" ]; then
            echo "S3 upload skipped (GENQ_RELEASES_BUCKET or AWS credentials not configured)"
            exit 0
          fi
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:8}"
          aws s3 cp GenQuery-Terminal-Linux.tar.gz \
            "s3://$GENQ_RELEASES_BUCKET/linux/latest/GenQuery-Terminal-Linux.tar.gz"
          aws s3 cp GenQuery-Terminal-Linux.tar.gz \
            "s3://$GENQ_RELEASES_BUCKET/linux/$SHORT_SHA/GenQuery-Terminal-Linux.tar.gz"
          echo "Uploaded to s3://$GENQ_RELEASES_BUCKET/linux/latest/ and /linux/$SHORT_SHA/"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-Linux
          path: GenQuery-Terminal-Linux.tar.gz
          retention-days: 14
