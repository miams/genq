name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Tests

    permissions:
      checks: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "*"

      - name: Run Tests
        shell: nu {0}
        run: nu tests/run-tests.nu --ci

      - name: Publish Test Results (Linux)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && runner.os == 'Linux'
        with:
          files: test-report.xml

      - name: Publish Test Results (macOS)
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        if: always() && runner.os == 'macOS'
        with:
          files: test-report.xml

      - name: Publish Test Results (Windows)
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always() && runner.os == 'Windows'
        with:
          files: test-report.xml

      - name: Publish Test Summary to Gist
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux'
        shell: nu {0}
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          let gist_id = $env.GIST_ID
          let data = {
            files: {
              "test-summary.json": {
                content: (open --raw test-summary.json)
              }
            }
          }
          (
            $data | http patch
              --redirect-mode "follow"
              --content-type "application/json"
              --headers {
                Authorization: $"Bearer ($env.GIST_TOKEN)"
                Accept: "application/vnd.github+json"
                X-GitHub-Api-Version: "2022-11-28"
              }
              $"https://api.github.com/gists/($gist_id)"
          ) | ignore
