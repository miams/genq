name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Job 1: Fast tests — no database required; run in parallel for quick CI feedback
  fast:
    name: Fast Tests (${{ matrix.platform }})

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject version into config
        shell: bash
        run: |
          VERSION=$(git describe --tags --always)
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" config/default.toml
          rm -f config/default.toml.bak
          echo "Injected version: $VERSION"

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "*"

      - name: Run fast tests (no DB required)
        # Covers: config, paths, validation, smoke (syntax checks)
        # Test names prefixed with "fast:" are matched by --fast flag
        shell: nu {0}
        run: nu tests/run-tests.nu --fast --fail

  # Job 2: DB tests — pres2025 always runs; Iiams downloaded from S3 when credentials exist
  db:
    name: DB Tests (${{ matrix.platform }})

    permissions:
      checks: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject version into config
        shell: bash
        run: |
          VERSION=$(git describe --tags --always)
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" config/default.toml
          rm -f config/default.toml.bak
          echo "Injected version: $VERSION"

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "*"

      - name: Add sqlite3 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # sqlite3.exe ships with Git for Windows (always present on GitHub runners).
          # Nushell's genq tabulate trees uses ^sqlite3 to bootstrap a temp SQLite file.
          $gitBin = "C:\Program Files\Git\usr\bin"
          if (Test-Path "$gitBin\sqlite3.exe") {
            "$gitBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "sqlite3 added from $gitBin"
          } else {
            Write-Host "sqlite3 not found at $gitBin — installing via Chocolatey"
            choco install sqlite -y --no-progress
          }

      - name: Download Test Database from S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          GENQ_TEST_BUCKET: ${{ vars.GENQ_TEST_BUCKET }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$GENQ_TEST_BUCKET" ]; then
            aws s3 cp "s3://$GENQ_TEST_BUCKET/Iiams.rmtree" tests/fixtures/Iiams.rmtree
            echo "GENQ_TEST_DB=tests/fixtures/Iiams.rmtree" >> $GITHUB_ENV
            echo "Downloaded test database from s3://$GENQ_TEST_BUCKET/Iiams.rmtree"
          else
            echo "Skipping DB download: AWS credentials or GENQ_TEST_BUCKET not configured"
          fi

      - name: Run [db-read] tests serialized (avoids SQLite lock contention)
        # JUnit report + test-summary.json produced by --ci
        shell: nu {0}
        run: nu tests/run-tests.nu --ci

      - name: Publish Test Results (Linux)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && runner.os == 'Linux'
        with:
          files: test-report.xml

      - name: Publish Test Results (macOS)
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        if: always() && runner.os == 'macOS'
        with:
          files: test-report.xml

      - name: Publish Test Results (Windows)
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always() && runner.os == 'Windows'
        with:
          files: test-report.xml

      - name: Publish Test Summary to Gist
        if: github.ref == 'refs/heads/main' && runner.os == 'Linux'
        shell: nu {0}
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          let gist_id = $env.GIST_ID
          let data = {
            files: {
              "test-summary.json": {
                content: (open --raw test-summary.json)
              }
            }
          }
          (
            $data | http patch
              --redirect-mode "follow"
              --content-type "application/json"
              --headers {
                Authorization: $"Bearer ($env.GIST_TOKEN)"
                Accept: "application/vnd.github+json"
                X-GitHub-Api-Version: "2022-11-28"
              }
              $"https://api.github.com/gists/($gist_id)"
          ) | ignore

      - name: Ingest test results to Turso
        if: always()
        shell: bash {0}
        env:
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GENQ_SOURCE: ci-${{ matrix.platform }}
        run: nu tests/ingest-results.nu
