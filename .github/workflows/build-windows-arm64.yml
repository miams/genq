name: Build Windows ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ---------------------------------------------------------------------------
  # Windows ARM64 — Windows Terminal fork + bundled genq + Nushell → ARM64 .msix
  # ---------------------------------------------------------------------------
  build-windows-arm64:
    name: Build Windows ARM64 (Windows Terminal)
    runs-on: windows-2022  # pinned: windows-latest is now 2025 which has XAML WMC9999 regression with SDK 10.0.26100.0

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkouts
      # -----------------------------------------------------------------------
      - name: Checkout genq
        uses: actions/checkout@v4

      - name: Checkout genq-terminal-windows
        uses: actions/checkout@v4
        with:
          repository: miams/genq-terminal-windows
          ref: genq
          path: genq-terminal-windows

      # -----------------------------------------------------------------------
      # 2. Download Nushell ARM64 binary from GitHub releases
      # -----------------------------------------------------------------------
      - name: Download Nushell ARM64
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/nushell/nushell/releases/latest" `
            -Headers @{Authorization = "Bearer $env:GITHUB_TOKEN"}
          $version = $release.tag_name
          Write-Host "Bundling Nushell $version"
          echo "NU_VERSION=$version" >> $env:GITHUB_ENV

          $armUrl = ($release.assets | Where-Object { $_.name -match "aarch64-pc-windows-msvc\.zip$" }).browser_download_url
          Invoke-WebRequest $armUrl -OutFile nu-arm64.zip
          Expand-Archive nu-arm64.zip -DestinationPath nu-arm64

      # -----------------------------------------------------------------------
      # 3. Build toolchain setup
      # -----------------------------------------------------------------------
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore SDK-style projects
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          # NuGet.Config uses <clear/> so only the private TerminalDependencies feed is active.
          # That feed lacks .NET 8 runtime reference packs. Installing the .NET 8 SDK above
          # puts the targeting packs in C:\Program Files\dotnet\packs\ so dotnet restore
          # finds them locally without needing any NuGet feed.
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          dotnet restore src\cascadia\WpfTerminalControl\WpfTerminalControl.csproj
          dotnet restore src\cascadia\WpfTerminalTestNetCore\WpfTerminalTestNetCore.csproj
          dotnet restore src\tools\TerminalStress\TerminalStress.csproj

      # -----------------------------------------------------------------------
      # 4. Create signing certificate
      #    Subject must match Package.appxmanifest Publisher="CN=Zephyr Systems"
      #    For production: set GENQ_SIGNING_PFX_B64 + GENQ_SIGNING_PFX_PASSWORD secrets.
      # -----------------------------------------------------------------------
      - name: Create signing certificate
        shell: pwsh
        run: |
          if ($env:GENQ_SIGNING_PFX_B64) {
            [System.IO.File]::WriteAllBytes(
              "genq-signing.pfx",
              [Convert]::FromBase64String($env:GENQ_SIGNING_PFX_B64)
            )
            echo "CERT_SOURCE=supplied" >> $env:GITHUB_ENV
          } else {
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=Zephyr Systems" `
              -KeyUsage DigitalSignature `
              -FriendlyName "GenQuery Terminal (Development - not for distribution)" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            $secPwd = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
            Export-PfxCertificate `
              -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
              -FilePath "genq-signing.pfx" `
              -Password $secPwd
            echo "CERT_SOURCE=self-signed" >> $env:GITHUB_ENV
          }
        env:
          GENQ_SIGNING_PFX_B64: ${{ secrets.GENQ_SIGNING_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.GENQ_SIGNING_PFX_PASSWORD || 'genq-dev-temp-unsigned' }}

      # -----------------------------------------------------------------------
      # 5. Stage genq source files into CascadiaPackage
      #    Config written as array, NOT a here-string: TOML lines at column-0
      #    terminate YAML block scalars, causing silent truncation.
      # -----------------------------------------------------------------------
      - name: Stage genq source files
        shell: pwsh
        run: |
          $pkgDir = "genq-terminal-windows\src\cascadia\CascadiaPackage\genq"
          New-Item -ItemType Directory -Force -Path "$pkgDir\src\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkgDir\config"  | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkgDir\scripts" | Out-Null

          Copy-Item -Force          "src\main.nu"       "$pkgDir\src\"
          Copy-Item -Recurse -Force "src\lib\common"    "$pkgDir\src\lib\"
          Copy-Item -Recurse -Force "src\lib\ext"       "$pkgDir\src\lib\"

          # Launch scripts from genq-terminal-windows (copy if present)
          $scriptsDir = "genq-terminal-windows\genq\scripts"
          if (Test-Path $scriptsDir) {
            Copy-Item -Recurse -Force "$scriptsDir\*" "$pkgDir\scripts\"
          }

          # Distribution config — no developer-specific paths
          $cfg = @(
            '[database]',
            'active = ""',
            '',
            '[paths]',
            'sql_dir = "sql"',
            'lib_dir = "src/lib"',
            'ext_dir = "src/lib/ext"',
            'output_dir = "vault"',
            '',
            '[display]',
            'date_format = 1',
            'table_mode = "rounded"',
            '',
            '[extensions]',
            'enabled = ["miams", "pres2020"]'
          )
          $cfg | Set-Content -Encoding UTF8 "$pkgDir\config\default.toml"

      # -----------------------------------------------------------------------
      # 6a. Patch NuGet.Config to add nuget.org for packages.config C++ projects
      #     The project NuGet.Config has <clear/> which removes nuget.org, leaving
      #     only the private TerminalDependencies feed. C++ packages.config projects
      #     (e.g. WIL / Microsoft.Windows.ImplementationLibrary) need nuget.org.
      #     RestoreAdditionalProjectSources only helps PackageReference projects.
      # -----------------------------------------------------------------------
      - name: Add nuget.org to NuGet sources (packages.config C++ restore)
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          $configPath = "NuGet.Config"
          $xml = [xml](Get-Content $configPath)
          $src = $xml.configuration.packageSources
          $add = $xml.CreateElement("add")
          $add.SetAttribute("key", "nuget.org")
          $add.SetAttribute("value", "https://api.nuget.org/v3/index.json")
          $src.AppendChild($add) | Out-Null
          $xml.Save((Resolve-Path $configPath))
          Write-Host "NuGet.Config updated — nuget.org added for C++ packages.config restore"

      # -----------------------------------------------------------------------
      # 6b. Restore packages.config C++ packages via nuget.exe
      #     msbuild /restore only handles PackageReference (SDK-style) projects.
      #     packages.config vcxproj projects (WIL, etc.) need nuget.exe restore.
      #     Invoke-OpenConsoleBuild (used for x64) triggers this automatically;
      #     raw msbuild (used for ARM64) does not.
      # -----------------------------------------------------------------------
      - name: Restore packages.config packages (nuget.exe)
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          nuget restore OpenConsole.slnx -NonInteractive -Verbosity normal

      # -----------------------------------------------------------------------
      # 6c. Build ARM64 Release MSIX
      #     /restore is required to fetch ARM64-specific runtime packs
      #     (NETSDK1112: Microsoft.Windows.SDK.NET.Ref not found otherwise)
      # -----------------------------------------------------------------------
      - name: Build ARM64 Release
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          $nuExe = Get-ChildItem "..\nu-arm64" -Recurse -Filter "nu.exe" | Select-Object -First 1
          Copy-Item -Force $nuExe.FullName "src\cascadia\CascadiaPackage\genq\nu.exe"

          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          msbuild.exe OpenConsole.slnx `
            /restore `
            /p:Platform=ARM64 `
            /p:Configuration=Release `
            /p:WindowsTargetPlatformVersion=10.0.22621.0 `
            /p:TargetPlatformVersion=10.0.22621.0 `
            /p:WindowsTerminalBranding=Release `
            "/p:RestoreAdditionalProjectSources=https://api.nuget.org/v3/index.json"

      # -----------------------------------------------------------------------
      # 7. Sign ARM64 MSIX
      # -----------------------------------------------------------------------
      - name: Sign ARM64 MSIX
        shell: pwsh
        run: |
          $sdkBin   = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64"
          $signtool = "$sdkBin\signtool.exe"
          $certPwd  = $env:CERT_PASSWORD

          $msix = Get-ChildItem -Path "genq-terminal-windows\src\cascadia\CascadiaPackage\AppPackages" -Recurse -Filter "*.msix" |
            Where-Object { $_.Name -match "ARM64" } |
            Select-Object -First 1
          if (-not $msix) { throw "ARM64 MSIX not found under CascadiaPackage\AppPackages" }

          Write-Host "Signing $($msix.FullName)"
          & $signtool sign /fd SHA256 /f genq-signing.pfx /p $certPwd $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

          Copy-Item $msix.FullName "$env:GITHUB_WORKSPACE\GenQuery-Terminal-Windows-ARM64.msix"
          Write-Host "Signed MSIX: $($msix.FullName) ($env:CERT_SOURCE cert)"
        env:
          CERT_PASSWORD: ${{ secrets.GENQ_SIGNING_PFX_PASSWORD || 'genq-dev-temp-unsigned' }}

      # -----------------------------------------------------------------------
      # 8. Upload to S3 (skipped gracefully if credentials not configured)
      # -----------------------------------------------------------------------
      - name: Upload to S3
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          GENQ_RELEASES_BUCKET:  ${{ vars.GENQ_RELEASES_BUCKET }}
        run: |
          if (-not $env:AWS_ACCESS_KEY_ID -or -not $env:GENQ_RELEASES_BUCKET) {
            Write-Host "S3 upload skipped (GENQ_RELEASES_BUCKET or AWS credentials not configured)"
            exit 0
          }
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          $msix     = "$env:GITHUB_WORKSPACE\GenQuery-Terminal-Windows-ARM64.msix"
          aws s3 cp $msix "s3://$env:GENQ_RELEASES_BUCKET/windows/arm64/latest/GenQuery-Terminal-Windows-ARM64.msix"
          aws s3 cp $msix "s3://$env:GENQ_RELEASES_BUCKET/windows/arm64/$shortSha/GenQuery-Terminal-Windows-ARM64.msix"
          Write-Host "Uploaded to s3://$env:GENQ_RELEASES_BUCKET/windows/arm64/latest/ and /windows/arm64/$shortSha/"

      # -----------------------------------------------------------------------
      # 9. Upload GitHub artifact (14-day retention)
      # -----------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-Windows-ARM64
          path: GenQuery-Terminal-Windows-ARM64.msix
          retention-days: 14
