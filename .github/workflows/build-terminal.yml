name: Build Terminal

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # macOS — Ghostty fork → DMG
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (Ghostty)
    runs-on: macos-latest

    steps:
      - name: Checkout genq
        uses: actions/checkout@v4

      - name: Checkout genq-terminal (private, via deploy key)
        uses: actions/checkout@v4
        with:
          repository: miams/genq-terminal
          ref: genq
          ssh-key: ${{ secrets.GENQ_TERMINAL_DEPLOY_KEY }}
          path: genq-terminal

      - name: Select Xcode 26 (genq-terminal requires macOS 26 SDK)
        run: |
          # genq-terminal/genq branch uses macOS 26 APIs — need Xcode 26
          XCODE26=$(find /Applications -maxdepth 1 -name "Xcode_26*.app" -type d 2>/dev/null | sort | tail -1)
          if [ -n "$XCODE26" ]; then
            echo "Found Xcode 26 at: $XCODE26"
            sudo xcode-select -s "$XCODE26/Contents/Developer"
          else
            echo "Xcode 26 not found. Available Xcode installs:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
            echo "Proceeding with default: $(xcodebuild -version | head -1)"
          fi
          xcodebuild -version

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"   # keep in sync with genq-terminal/build.zig.zon

      - name: Clear Zig build cache
        # Xcode version changed across runs — stale xcframework artifacts
        # in the cache cause CompileAssetCatalogVariant to fail. Force clean.
        run: rm -rf "${{ github.workspace }}/.zig-cache/o"

      - name: Build
        working-directory: genq-terminal
        env:
          # Use ad-hoc signing during build; the Sign step re-signs afterward
          CODE_SIGN_IDENTITY: "-"
        run: zig build -Doptimize=ReleaseFast

      - name: Sign
        working-directory: genq-terminal
        run: |
          xattr -cr zig-out/Ghostty.app
          codesign --force --deep --sign - "zig-out/Ghostty.app"

      - name: Package DMG
        working-directory: genq-terminal
        run: |
          mkdir -p /tmp/genq-dmg
          cp -r "zig-out/Ghostty.app" "/tmp/genq-dmg/GenQuery Terminal.app"
          ln -s /Applications /tmp/genq-dmg/Applications
          hdiutil create \
            -volname "GenQuery Terminal" \
            -srcfolder /tmp/genq-dmg \
            -ov -format UDZO \
            -o "$GITHUB_WORKSPACE/GenQuery-Terminal-macOS.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-macOS
          path: GenQuery-Terminal-macOS.dmg
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux — Ghostty fork → AppImage (stub, packaging TBD)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux (Ghostty)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout genq
        uses: actions/checkout@v4

      - name: Checkout genq-terminal (private, via deploy key)
        uses: actions/checkout@v4
        with:
          repository: miams/genq-terminal
          ref: genq
          ssh-key: ${{ secrets.GENQ_TERMINAL_DEPLOY_KEY }}
          path: genq-terminal

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            libglib2.0-bin \
            libwayland-dev \
            wayland-protocols \
            libgirepository1.0-dev \
            gobject-introspection \
            valac \
            gettext \
            xdg-utils \
            meson \
            ninja-build
          # apt ships blueprint-compiler 0.12.0; Ghostty requires 0.16.0+
          # blueprint-compiler uses meson, not pip — install from source
          git clone --depth=1 https://gitlab.gnome.org/jwestman/blueprint-compiler.git /tmp/blueprint-compiler
          meson setup /tmp/blueprint-compiler/_build /tmp/blueprint-compiler
          sudo meson install -C /tmp/blueprint-compiler/_build
          # gtk4-layer-shell not packaged for Ubuntu 24.04 — build from source
          # introspection+valac must be enabled so examples/meson.build can reference vapi
          git clone --depth=1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/_build /tmp/gtk4-layer-shell -Ddocs=false -Dtests=false
          sudo meson install -C /tmp/gtk4-layer-shell/_build
          sudo ldconfig

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Build
        working-directory: genq-terminal
        run: zig build -Doptimize=ReleaseFast -Dapp-runtime=gtk

      - name: Package (stub — AppImage packaging TBD in Phase 3)
        working-directory: genq-terminal
        run: |
          tar -czf "$GITHUB_WORKSPACE/GenQuery-Terminal-Linux.tar.gz" \
            -C zig-out/bin ghostty

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-Linux
          path: GenQuery-Terminal-Linux.tar.gz
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows — Windows Terminal fork + bundled genq + Nushell → .msixbundle
  #
  # Produces a self-contained installer: the user needs no Nushell install.
  # Bundled nu.exe is completely isolated from any system Nushell.
  # Builds x64 and ARM64; bundles them into a single .msixbundle.
  # Signed with a temporary self-signed cert (replace with EV cert when obtained).
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (Windows Terminal)
    runs-on: windows-2022  # windows-latest (2025) has XAML compiler WMC9999 regression

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkouts
      # -----------------------------------------------------------------------
      - name: Checkout genq
        uses: actions/checkout@v4
        # Default checkout — genq source at workspace root

      - name: Checkout genq-terminal-windows
        uses: actions/checkout@v4
        with:
          repository: miams/genq-terminal-windows
          ref: genq
          path: genq-terminal-windows

      # -----------------------------------------------------------------------
      # 2. Download Nushell binaries (x64 + ARM64) from GitHub releases
      # -----------------------------------------------------------------------
      - name: Download Nushell binaries
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/nushell/nushell/releases/latest"
          $version  = $release.tag_name
          Write-Host "Bundling Nushell $version"
          echo "NU_VERSION=$version" >> $env:GITHUB_ENV

          $x64url = ($release.assets | Where-Object { $_.name -match "x86_64-pc-windows-msvc\.zip$" }).browser_download_url
          $armUrl = ($release.assets | Where-Object { $_.name -match "aarch64-pc-windows-msvc\.zip$" }).browser_download_url

          Invoke-WebRequest $x64url -OutFile nu-x64.zip
          Invoke-WebRequest $armUrl -OutFile nu-arm64.zip
          Expand-Archive nu-x64.zip   -DestinationPath nu-x64
          Expand-Archive nu-arm64.zip -DestinationPath nu-arm64

      # -----------------------------------------------------------------------
      # 3. Build toolchain setup
      # -----------------------------------------------------------------------
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore SDK-style projects
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          # NuGet.Config uses <clear/> so only the private TerminalDependencies feed is active.
          # That feed lacks .NET 8 runtime reference packs. Installing the .NET 8 SDK above
          # puts the targeting packs in C:\Program Files\dotnet\packs\ so dotnet restore
          # finds them locally without needing any NuGet feed.
          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH = "C:\Program Files\dotnet;$env:PATH"
          dotnet restore src\cascadia\WpfTerminalControl\WpfTerminalControl.csproj
          dotnet restore src\cascadia\WpfTerminalTestNetCore\WpfTerminalTestNetCore.csproj
          dotnet restore src\tools\TerminalStress\TerminalStress.csproj

      # -----------------------------------------------------------------------
      # 4. Create self-signed certificate
      #    Subject must match Package.appxmanifest Publisher="CN=Zephyr Systems"
      #    Replace with EV cert when obtained — set GENQ_SIGNING_PFX_B64 and
      #    GENQ_SIGNING_PFX_PASSWORD as repository secrets.
      # -----------------------------------------------------------------------
      - name: Create signing certificate
        shell: pwsh
        run: |
          if ($env:GENQ_SIGNING_PFX_B64) {
            # Use the supplied EV / production certificate
            [System.IO.File]::WriteAllBytes(
              "genq-signing.pfx",
              [Convert]::FromBase64String($env:GENQ_SIGNING_PFX_B64)
            )
            echo "CERT_SOURCE=supplied" >> $env:GITHUB_ENV
          } else {
            # Generate a temporary self-signed certificate for dev/preview builds
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=Zephyr Systems" `
              -KeyUsage DigitalSignature `
              -FriendlyName "GenQuery Terminal (Development - not for distribution)" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            $secPwd = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
            Export-PfxCertificate `
              -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
              -FilePath "genq-signing.pfx" `
              -Password $secPwd
            echo "CERT_SOURCE=self-signed" >> $env:GITHUB_ENV
          }
        env:
          GENQ_SIGNING_PFX_B64: ${{ secrets.GENQ_SIGNING_PFX_B64 }}
          CERT_PASSWORD: ${{ secrets.GENQ_SIGNING_PFX_PASSWORD || 'genq-dev-temp-unsigned' }}

      # -----------------------------------------------------------------------
      # 5. Stage genq source files into the package directory
      #    (shared between x64 + ARM64 — only nu.exe differs between arches)
      # -----------------------------------------------------------------------
      - name: Stage genq source files
        shell: pwsh
        run: |
          $pkgDir = "genq-terminal-windows\src\cascadia\CascadiaPackage\genq"

          # Create layout
          New-Item -ItemType Directory -Force -Path "$pkgDir\src\lib"   | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkgDir\config"     | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkgDir\scripts"    | Out-Null

          # genq Nushell source (from this repo's workspace root)
          Copy-Item -Force          "src\main.nu"  "$pkgDir\src\"
          Copy-Item -Recurse -Force "src\lib\common" "$pkgDir\src\lib\"
          Copy-Item -Recurse -Force "src\lib\ext"    "$pkgDir\src\lib\"

          # Launch scripts (from genq-terminal-windows repo)
          Copy-Item -Force "genq-terminal-windows\genq\scripts\genquery-start.ps1" "$pkgDir\scripts\"
          Copy-Item -Force "genq-terminal-windows\genq\scripts\env.nu"             "$pkgDir\scripts\"

          # Clean distribution config — no developer-specific paths
          # (Avoid PowerShell here-strings; TOML lines at column-0 terminate the YAML block scalar)
          $configLines = @(
            '[database]',
            'active = ""',
            '',
            '[paths]',
            'sql_dir = "sql"',
            'lib_dir = "src/lib"',
            'ext_dir = "src/lib/ext"',
            'output_dir = "vault"',
            '',
            '[display]',
            'date_format = 1',
            'table_mode = "rounded"',
            '',
            '[extensions]',
            'enabled = ["miams", "pres2020"]'
          )
          $configLines | Set-Content -Encoding UTF8 "$pkgDir\config\default.toml"

      # -----------------------------------------------------------------------
      # 6. Build x64 Release MSIX
      # -----------------------------------------------------------------------
      - name: Build x64 Release
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          # Stage x64 nu.exe
          $nuExe = Get-ChildItem "..\nu-x64" -Recurse -Filter "nu.exe" | Select-Object -First 1
          Copy-Item -Force $nuExe.FullName "src\cascadia\CascadiaPackage\genq\nu.exe"

          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH        = "C:\Program Files\dotnet;$env:PATH"
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          Invoke-OpenConsoleBuild `
            /p:Platform=x64 `
            /p:Configuration=Release `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /p:TargetPlatformVersion=10.0.26100.0 `
            /p:WindowsTerminalBranding=Release

      # -----------------------------------------------------------------------
      # 7. Build ARM64 Release MSIX
      #    NuGet restore already done in step 6; call msbuild directly.
      # -----------------------------------------------------------------------
      - name: Build ARM64 Release
        working-directory: genq-terminal-windows
        shell: pwsh
        run: |
          # Swap in ARM64 nu.exe
          $nuExe = Get-ChildItem "..\nu-arm64" -Recurse -Filter "nu.exe" | Select-Object -First 1
          Copy-Item -Force $nuExe.FullName "src\cascadia\CascadiaPackage\genq\nu.exe"

          $env:DOTNET_ROOT = 'C:\Program Files\dotnet'
          $env:PATH        = "C:\Program Files\dotnet;$env:PATH"
          Import-Module .\tools\OpenConsole.psm1
          Set-MsBuildDevEnvironment
          # Skip NuGet restore (already done); call msbuild directly
          msbuild.exe OpenConsole.slnx `
            /p:Platform=ARM64 `
            /p:Configuration=Release `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /p:TargetPlatformVersion=10.0.26100.0 `
            /p:WindowsTerminalBranding=Release

      # -----------------------------------------------------------------------
      # 8. Sign individual MSIX packages, bundle into .msixbundle, sign bundle
      # -----------------------------------------------------------------------
      - name: Sign, bundle, and sign bundle
        shell: pwsh
        run: |
          # Locate SDK tools (SDK 10.0.26100.0 is the only one on this runner)
          $sdkBin  = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64"
          $signtool = "$sdkBin\signtool.exe"
          $makeappx = "$sdkBin\makeappx.exe"
          $certPwd  = $env:CERT_PASSWORD

          # Sign each per-arch MSIX
          Get-ChildItem -Path "genq-terminal-windows\bin" -Recurse -Filter "*.msix" |
            Where-Object { $_.FullName -match "Release" } |
            ForEach-Object {
              Write-Host "Signing $($_.FullName)"
              & $signtool sign /fd SHA256 /f genq-signing.pfx /p $certPwd $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
            }

          # Bundle
          .\genq-terminal-windows\build\scripts\Create-AppxBundle.ps1 `
            -InputPath  "genq-terminal-windows\bin" `
            -ProjectName "CascadiaPackage" `
            -BundleVersion "0.1.1.0" `
            -OutputPath "$env:GITHUB_WORKSPACE\GenQuery-Terminal-Windows.msixbundle" `
            -MakeAppxPath $makeappx

          # Sign bundle
          & $signtool sign /fd SHA256 /f genq-signing.pfx /p $certPwd `
            /tr http://timestamp.digicert.com /td SHA256 `
            "$env:GITHUB_WORKSPACE\GenQuery-Terminal-Windows.msixbundle"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for msixbundle" }

          Write-Host "Bundle built and signed ($env:CERT_SOURCE cert)"
        env:
          CERT_PASSWORD: ${{ secrets.GENQ_SIGNING_PFX_PASSWORD || 'genq-dev-temp-unsigned' }}

      # -----------------------------------------------------------------------
      # 9. Upload to S3 release bucket (requires GENQ_RELEASES_BUCKET var +
      #    AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets)
      # -----------------------------------------------------------------------
      - name: Upload to S3
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          GENQ_RELEASES_BUCKET:  ${{ vars.GENQ_RELEASES_BUCKET }}
        run: |
          if (-not $env:AWS_ACCESS_KEY_ID -or -not $env:GENQ_RELEASES_BUCKET) {
            Write-Host "S3 upload skipped (GENQ_RELEASES_BUCKET or AWS credentials not configured)"
            exit 0
          }
          $shortSha = "${{ github.sha }}".Substring(0, 8)
          $bundle   = "$env:GITHUB_WORKSPACE\GenQuery-Terminal-Windows.msixbundle"
          aws s3 cp $bundle "s3://$env:GENQ_RELEASES_BUCKET/windows/latest/GenQuery-Terminal-Windows.msixbundle"
          aws s3 cp $bundle "s3://$env:GENQ_RELEASES_BUCKET/windows/$shortSha/GenQuery-Terminal-Windows.msixbundle"
          Write-Host "Uploaded to s3://$env:GENQ_RELEASES_BUCKET/windows/latest/ and /windows/$shortSha/"

      # -----------------------------------------------------------------------
      # 10. Upload GitHub artifact (14-day retention for download/testing)
      # -----------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenQuery-Terminal-Windows
          path: GenQuery-Terminal-Windows.msixbundle
          retention-days: 14
