[database]
active = "production"

[database.connections]
demo = "./data/pres2020.rmtree"
production = "./data/Iiams.rmtree"

[paths]
sql_dir = "sql"
lib_dir = "src/lib"
ext_dir = "src/lib/ext"
output_dir = "vault"

[display]
date_format = 1
table_mode = "rounded"

[extensions]
enabled = [
    "miams",
    "pres2020",
]

[sync.sources]
production = "/Users/miams/Genealogy/RootsMagic/Database/Iiams.rmtree"
demo = "~/Genealogy/RootsMagic/Database/pres2020.rmtree"

[sync.targets]
production = "./data/Iiams.rmtree"
demo = "./data/pres2020.rmtree"

[sync.options]
backup_before_sync = true
verify_after_sync = true
