[metadata]
version = "v0.2.0"

[database]
active = "production"

[database.connections]
demo = "./data/pres2025.rmtree"
production = "./data/Iiams.rmtree"

[paths]
sql_dir = "sql"
lib_dir = "src/lib"
ext_dir = "src/lib/ext"
output_dir = "vault"

[display]
date_format = 1
table_mode = "rounded"

[extensions]
enabled = [
    "miams",
    "pres2025",
]

[sync.sources]
production = "/Users/miams/Genealogy/RootsMagic/Database/RM11/Iiams.rmtree"
demo = "~/Genealogy/RootsMagic/Database/pres2025.rmtree"

[sync.targets]
production = "./data/Iiams.rmtree"
demo = "./data/pres2025.rmtree"

[sync.options]
backup_before_sync = true
verify_after_sync = true

[telemetry]
enabled = true
auto_send = false
endpoint_mode = "otlp"
endpoint_url = "https://n53fa2v117.execute-api.us-east-1.amazonaws.com"
retention_days = 30
